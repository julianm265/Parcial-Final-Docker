<script>
        const grid = document.getElementById('seatingGrid');
        const selectedSeatsTxt = document.getElementById('selectedSeatsTxt');
        const totalPriceTxt = document.getElementById('totalPriceTxt');
        const btnVender = document.getElementById('btnVender');
        
        const PRECIO_TIQUETE = 12000; 
        let asientosSeleccionados = [];

        // CORREGIDO: Variable unida sin espacios extraños
        const ocupadosIniciales = [3, 7, 12, 14, 22];

        // Generar la matriz de 25 asientos dinámicamente
        for (let i = 1; i <= 25; i++) {
            const seat = document.createElement('div');
            seat.classList.add('seat');
            seat.innerText = i;

            if (ocupadosIniciales.includes(i)) {
                seat.classList.add('occupied');
            } else {
                seat.addEventListener('click', () => toggleAsiento(i, seat));
            }
            grid.appendChild(seat);
        }

        // Lógica para seleccionar/deseleccionar asientos
        function toggleAsiento(id, elemento) {
            if (elemento.classList.contains('selected')) {
                elemento.classList.remove('selected');
                asientosSeleccionados = asientosSeleccionados.filter(item => item !== id);
            } else {
                elemento.classList.add('selected');
                asientosSeleccionados.push(id);
            }
            actualizarPanel();
        }

        // Actualizar cálculos en la interfaz
        function actualizarPanel() {
            if (asientosSeleccionados.length > 0) {
                selectedSeatsTxt.innerText = asientosSeleccionados.join(', ');
                totalPriceTxt.innerText = `$${(asientosSeleccionados.length * PRECIO_TIQUETE).toLocaleString()} COP`;
                btnVender.disabled = false;
            } else {
                selectedSeatsTxt.innerText = 'Ninguno';
                totalPriceTxt.innerText = '$0 COP';
                btnVender.disabled = true;
            }
        }

        // Simular la confirmación del tiquete
        btnVender.addEventListener('click', () => {
            alert(`¡Venta Exitosa!\nAsientos reservados: ${asientosSeleccionados.join(', ')}\nTotal: ${totalPriceTxt.innerText}\n\nLos asientos ahora pasarán a estado 'Ocupado'.`);
            
            const seats = document.querySelectorAll('.seat.selected');
            seats.forEach(seat => {
                seat.classList.remove('selected');
                seat.classList.add('occupied');
                const nuevoNodo = seat.cloneNode(true);
                seat.parentNode.replaceChild(nuevoNodo, seat);
            });

            asientosSeleccionados = [];
            actualizarPanel();
        });
    </script>
